syntax = "proto3";

package pansion.v1;

option go_package = "github.com/ferzferz11-sudo/pansion/backend/gen/pansion/v1";

// Health check service
service HealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {}
message HealthCheckResponse {
  string status = 1;
}

// Common types
message Timestamp {
  int64 seconds = 1;
  int64 nanos = 2;
}
